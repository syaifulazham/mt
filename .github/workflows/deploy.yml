name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # needed to push to ghcr.io

    steps:
      - uses: actions/checkout@v4

      # ── Write .env.production on the runner ──────────────────────────────────
      - name: Generate .env.production
        run: |
          cat > .env.production << 'EOF'
          NODE_ENV=production
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          AUTH_SECRET=${{ secrets.AUTH_SECRET }}
          AUTH_TOTP_KEY=${{ secrets.AUTH_TOTP_KEY }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY=${{ secrets.CLERK_SECRET_KEY }}
          CLERK_WEBHOOK_SECRET=${{ secrets.CLERK_WEBHOOK_SECRET }}
          NEXT_PUBLIC_APP_URL=https://${{ secrets.DOMAIN }}
          AUTH_URL=https://${{ secrets.DOMAIN }}
          RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          EPTIM_API_KEY=${{ secrets.EPTIM_API_KEY }}
          EPTIM_URL=${{ secrets.EPTIM_URL }}
          EPTIMEDU_API_KEY=${{ secrets.EPTIMEDU_API_KEY }}
          EPTIMEDU_BASE_URL=${{ secrets.EPTIMEDU_BASE_URL }}
          EPTIMDRONE_API_KEY=${{ secrets.EPTIMDRONE_API_KEY }}
          EPTIMDRONE_BASE_URL=${{ secrets.EPTIMDRONE_BASE_URL }}
          EPTIMDRONE_APP_URL=${{ secrets.EPTIMDRONE_APP_URL }}
          WALKIN_EPTIM_VIBLOCK_URL=${{ secrets.WALKIN_EPTIM_VIBLOCK_URL }}
          WALKIN_EPTIM_VIBLOCK_API_KEY=${{ secrets.WALKIN_EPTIM_VIBLOCK_API_KEY }}
          PORT=${{ secrets.PORT }}
          R2_ACCOUNT_ID=${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME=${{ secrets.R2_BUCKET_NAME }}
          NEXT_PUBLIC_R2_PUBLIC_URL=${{ secrets.NEXT_PUBLIC_R2_PUBLIC_URL }}
          EOF

      # ── Write nginx config ───────────────────────────────────────────────────
      - name: Generate nginx config
        run: |
          cat > nginx-mt.conf << 'EOF'
          server {
              listen 80;
              server_name ${{ secrets.DOMAIN }};
              return 301 https://$host$request_uri;
          }

          server {
              listen 443 ssl;
              server_name ${{ secrets.DOMAIN }};
              ssl_certificate /etc/letsencrypt/live/${{ secrets.DOMAIN }}/fullchain.pem;
              ssl_certificate_key /etc/letsencrypt/live/${{ secrets.DOMAIN }}/privkey.pem;
              include /etc/letsencrypt/options-ssl-nginx.conf;
              ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
              client_max_body_size 50M;
              location /uploads/ {
                  alias /opt/mt/uploads/;
                  expires 30d;
                  add_header Cache-Control "public, no-transform";
              }
              location / {
                  proxy_pass http://127.0.0.1:3310;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "upgrade";
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_set_header X-Forwarded-Host $host;
                  proxy_set_header X-Forwarded-Port 443;
                  proxy_read_timeout 60s;
              }
          }
          EOF
          # Strip leading whitespace caused by YAML indentation
          sed -i 's/^          //' nginx-mt.conf

      # ── Set up Docker Buildx (required for build-push-action + GHA cache) ──────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Log in to GitHub Container Registry ──────────────────────────────────
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Build migrator image on runner and push to ghcr.io ───────────────────
      - name: Build and push migrator image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          target: migrator
          tags: ghcr.io/${{ github.repository_owner }}/mt:migrator
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Build app image on runner and push to ghcr.io ────────────────────────
      - name: Build and push app image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/mt:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_APP_URL=https://${{ secrets.DOMAIN }}
            NEXT_PUBLIC_R2_PUBLIC_URL=${{ secrets.NEXT_PUBLIC_R2_PUBLIC_URL }}

      # ── Copy .env.production and nginx config to server ──────────────────────
      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: .env.production,nginx-mt.conf
          target: /opt/mt/

      # ── SSH: nginx + certbot + pull pre-built images + deploy ─────────────────
      - name: Deploy on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            DOMAIN="${{ secrets.DOMAIN }}"
            GHCR_IMAGE="ghcr.io/${{ github.repository_owner }}/mt"

            # ── nginx setup (idempotent) ────────────────────────────────────────
            echo "── Setting up nginx ──"
            if ! command -v nginx &>/dev/null; then
              sudo apt-get update -qq && sudo apt-get install -y nginx
            fi
            sudo ln -sf /etc/nginx/sites-available/mt /etc/nginx/sites-enabled/mt
            sudo rm -f /etc/nginx/sites-enabled/default
            sudo systemctl enable nginx

            # ── SSL certificate (bootstrap on first deploy, skip afterwards) ─────
            echo "── Checking SSL certificate ──"
            if [ ! -d "/etc/letsencrypt/live/$DOMAIN" ]; then
              echo "── Obtaining SSL certificate for $DOMAIN ──"
              if ! command -v certbot &>/dev/null; then
                sudo apt-get install -y certbot python3-certbot-nginx
              fi
              # Minimal HTTP-only config so nginx can start for the HTTP-01 challenge.
              # certbot --nginx also creates options-ssl-nginx.conf + ssl-dhparams.pem.
              printf 'server { listen 80; server_name %s; }\n' "$DOMAIN" \
                | sudo tee /etc/nginx/sites-available/mt > /dev/null
              sudo nginx -t && (sudo systemctl reload nginx 2>/dev/null || sudo systemctl start nginx)
              sudo rm -f /var/lib/letsencrypt/.certbot.lock
              sudo certbot --nginx \
                --non-interactive \
                --agree-tos \
                --email mahza13@gmail.com \
                --domains $DOMAIN \
                --redirect
            fi

            # Install custom nginx config (two-block SSL; overwrites any certbot-modified config)
            sudo cp /opt/mt/nginx-mt.conf /etc/nginx/sites-available/mt
            sudo nginx -t && (sudo systemctl reload nginx 2>/dev/null || sudo systemctl start nginx)

            # ── Pull pre-built images from ghcr.io ─────────────────────────────
            # Images were built on the GitHub Actions runner which has reliable
            # Docker Hub access; server only needs to reach ghcr.io
            echo "── Pulling pre-built images from ghcr.io ──"
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            # Remove stale local copies so Docker pulls fresh layers.
            # This prevents "failed to register layer / overlay mount" errors
            # caused by interrupted or corrupted previous pulls.
            docker rmi ${GHCR_IMAGE}:migrator 2>/dev/null || true
            docker rmi ${GHCR_IMAGE}:latest   2>/dev/null || true
            docker system prune -f

            docker pull ${GHCR_IMAGE}:migrator
            docker pull ${GHCR_IMAGE}:latest

            # ── Sync code (for prisma schema used by migrator) ──────────────────
            echo "── Syncing code ──"
            cd /opt/mt
            cp .env.production /tmp/.env.mt.production
            git fetch origin main
            git clean -fd
            git reset --hard origin/main
            cp /tmp/.env.mt.production .env.production

            # ── Migrating database ──────────────────────────────────────────────
            echo "── Migrating database ──"
            for migration in \
              20260520000000_add_missing_tables_and_columns \
              20260620000001_add_drone_access_team_events_prerequisites \
              20260721000001_add_walkin_viblock_judging_columns; do
              docker run --rm \
                --network host \
                --env-file /opt/mt/.env.production \
                ${GHCR_IMAGE}:migrator \
                node_modules/.bin/prisma migrate resolve --rolled-back "$migration" 2>/dev/null || true
            done
            docker run --rm \
              --network host \
              --env-file /opt/mt/.env.production \
              ${GHCR_IMAGE}:migrator

            # ── Restarting container ────────────────────────────────────────────
            echo "── Restarting container ──"
            docker stop mt 2>/dev/null || true
            docker rm   mt 2>/dev/null || true

            sudo mkdir -p /opt/mt/uploads /opt/mt/data
            sudo chown -R 1001:1001 /opt/mt/uploads /opt/mt/data

            docker run -d \
              --name mt \
              --network host \
              --env-file /opt/mt/.env.production \
              --restart unless-stopped \
              -v /opt/mt/uploads:/app/public/uploads \
              -v /opt/mt/data:/app/data \
              ${GHCR_IMAGE}:latest

            echo "── Pruning old images ──"
            docker image prune -f

            echo "── Done ──"
