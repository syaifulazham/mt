name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ── Write .env.production on the runner ──────────────────────────────────
      - name: Generate .env.production
        run: |
          cat > .env.production << 'EOF'
          NODE_ENV=production
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          AUTH_SECRET=${{ secrets.AUTH_SECRET }}
          AUTH_TOTP_KEY=${{ secrets.AUTH_TOTP_KEY }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY=${{ secrets.CLERK_SECRET_KEY }}
          CLERK_WEBHOOK_SECRET=${{ secrets.CLERK_WEBHOOK_SECRET }}
          NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}
          AUTH_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}
          RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          EPTIM_API_KEY=${{ secrets.EPTIM_API_KEY }}
          EPTIM_URL=${{ secrets.EPTIM_URL }}
          EPTIMEDU_API_KEY=${{ secrets.EPTIMEDU_API_KEY }}
          EPTIMEDU_BASE_URL=${{ secrets.EPTIMEDU_BASE_URL }}
          PORT=${{ secrets.PORT }}
          EOF

      # ── Write nginx config (no indentation so file is valid) ─────────────────
      - name: Generate nginx config
        run: |
          cat > nginx-mt.conf << 'EOF'
          server {
              listen 80;
              server_name ${{ secrets.DOMAIN }};
              location / {
                  proxy_pass         http://127.0.0.1:${{ secrets.PORT }};
                  proxy_http_version 1.1;
                  proxy_set_header   Upgrade           $http_upgrade;
                  proxy_set_header   Connection        "upgrade";
                  proxy_set_header   Host              $host;
                  proxy_set_header   X-Real-IP         $remote_addr;
                  proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
                  proxy_set_header   X-Forwarded-Proto $scheme;
                  proxy_read_timeout 60s;
              }
          }
          EOF
          # Strip leading whitespace caused by YAML indentation
          sed -i 's/^          //' nginx-mt.conf

      # ── Copy files to server ──────────────────────────────────────────────────
      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: .env.production,nginx-mt.conf
          target: /opt/mt/

      # ── SSH: nginx + certbot + deploy ─────────────────────────────────────────
      - name: Deploy on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            DOMAIN="${{ secrets.DOMAIN }}"

            # ── nginx setup (idempotent) ────────────────────────────────────────
            echo "── Setting up nginx ──"
            if ! command -v nginx &>/dev/null; then
              sudo apt-get update -qq && sudo apt-get install -y nginx
            fi

            sudo cp /opt/mt/nginx-mt.conf /etc/nginx/sites-available/mt
            sudo ln -sf /etc/nginx/sites-available/mt /etc/nginx/sites-enabled/mt
            sudo rm -f /etc/nginx/sites-enabled/default
            sudo nginx -t
            sudo systemctl enable nginx
            sudo systemctl reload nginx

            # ── certbot (only obtain cert if it doesn't exist yet) ──────────────
            echo "── Checking SSL certificate ──"
            if [ ! -d "/etc/letsencrypt/live/$DOMAIN" ]; then
              echo "── Obtaining SSL certificate for $DOMAIN ──"
              if ! command -v certbot &>/dev/null; then
                sudo apt-get install -y certbot python3-certbot-nginx
              fi
              sudo rm -f /var/lib/letsencrypt/.certbot.lock
              sudo certbot --nginx \
                --non-interactive \
                --agree-tos \
                --email mahza13@gmail.com \
                --domains $DOMAIN \
                --redirect
              sudo systemctl reload nginx
            else
              echo "── Certificate exists — restoring SSL to nginx config ──"
              sudo certbot install \
                --nginx \
                --non-interactive \
                --cert-name $DOMAIN \
                --redirect 2>/dev/null || true
              sudo systemctl reload nginx
            fi

            # ── app deploy ─────────────────────────────────────────────────────
            echo "── Pulling latest code ──"
            cd /opt/mt

            # Preserve env file — git clean would delete it (it's gitignored)
            # NEXT_PUBLIC_* vars must be present at docker build time
            cp .env.production /tmp/.env.mt.production

            git fetch origin main
            git clean -fd
            git reset --hard origin/main

            # Restore env file before build so NEXT_PUBLIC_ vars are embedded
            cp /tmp/.env.mt.production .env.production

            echo "── Building Docker images ──"
            # Extract NEXT_PUBLIC_ vars from env file — needed as build args
            # because .dockerignore excludes .env.* from the build context
            CLERK_PK=$(grep ^NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY .env.production | cut -d= -f2-)
            APP_URL=$(grep  ^NEXT_PUBLIC_APP_URL                .env.production | cut -d= -f2-)

            docker build --target migrator -t mt-migrator:latest .
            docker build \
              --build-arg "NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${CLERK_PK}" \
              --build-arg "NEXT_PUBLIC_APP_URL=${APP_URL}" \
              -t mt:latest .

            echo "── Migrating database ──"
            # Resolve any previously failed migration before re-applying
            docker run --rm \
              --network host \
              --env-file /opt/mt/.env.production \
              mt-migrator:latest \
              node_modules/.bin/prisma migrate resolve --rolled-back 20260520000000_add_missing_tables_and_columns 2>/dev/null || true
            docker run --rm \
              --network host \
              --env-file /opt/mt/.env.production \
              mt-migrator:latest

            echo "── Restarting container ──"
            docker stop mt 2>/dev/null || true
            docker rm   mt 2>/dev/null || true

            # Ensure uploads directory exists on host and is writable by uid 1001 (nextjs)
            sudo mkdir -p /opt/mt/uploads
            sudo chown -R 1001:1001 /opt/mt/uploads

            docker run -d \
              --name mt \
              --network host \
              --env-file /opt/mt/.env.production \
              --restart unless-stopped \
              -v /opt/mt/uploads:/app/public/uploads \
              mt:latest

            echo "── Pruning old images ──"
            docker image prune -f

            echo "── Done ──"
